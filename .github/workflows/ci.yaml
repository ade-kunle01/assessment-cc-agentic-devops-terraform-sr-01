name: CI Pipeline

on:
  pull_request:
    branches:
      - devel
      - stage

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          CI: true
        run: npm test -- --watch=false

      - name: Build project
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt (devel)
        working-directory: terraform/environments/devel
        run: terraform fmt -check -recursive

      - name: Terraform fmt (stage)
        working-directory: terraform/environments/stage
        run: terraform fmt -check -recursive
